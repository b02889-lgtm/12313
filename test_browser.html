<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a73e8;
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        p {
            color: #555;
            font-size: 1.2rem;
        }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e6f4ea;
            color: #137333;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 浏览器启动成功！</h1>
        <p>Puppeteer 浏览器已成功启动并运行。</p>
        <div class="status">✅ 浏览器状态：正常</div>
        <p style="margin-top: 20px; color: #888; font-size: 0.9rem;">当前时间：<span id="time"></span></p>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
