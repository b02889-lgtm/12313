[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-code-guardian"
version = "0.1.0"
description = "AI 驱动的代码健康守护者 - 智能预提交检查工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Code Guardian Team"}
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "anthropic>=0.18.0",
    "openai>=1.10.0",
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "mutmut>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
